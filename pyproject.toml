[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-terminal"
version = "2.5.1"
description = "A free, Bloomberg-style crypto terminal for your shell: live Coinbase prices, candles, order book, other exchanges, perps, indicators and smart alerts, plus one-shot commands (--json) and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Owen Alderson" }]
keywords = ["crypto", "terminal", "tui", "coinbase", "textual", "bitcoin", "mcp"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "textual>=8.0",
    "websockets>=14.0",
    "httpx>=0.27",
    "certifi",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
crypto-terminal = "crypto_terminal.__main__:main"

[project.urls]
Homepage = "https://github.com/owen-alderson/crypto-terminal"
